name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' &&
  format('YAGA CI {0} for #{1} at base {2}', github.event.action,
  github.event.pull_request.number, github.event.pull_request.base.sha) ||
  format('CI {0} on {1}', github.event_name, github.ref_name) }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  yaga-checks:
    name: YAGA Checks (branch, change, policy, repo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Typos CLI
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/crate-ci/typos/releases/download/v1.50.2/typos-v1.50.2-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/typos.tar.gz"
          echo "abcb3e257c7c2abeff4d903f7fe68071357637605bdb283ce2251f44bc70dc09  $RUNNER_TEMP/typos.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/typos-bin"
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/typos-bin" ./typos
          echo "$RUNNER_TEMP/typos-bin" >> "$GITHUB_PATH"
      - name: Check pull-request branch name
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          check: branch
          policy: .yaga/branch-policy.toml
          branch: ${{ github.head_ref }}
      - name: Check pushed branch name
        if: >-
          github.event_name == 'push' &&
          github.ref_type == 'branch' &&
          github.event.deleted == false
        uses: ./
        with:
          check: branch
          policy: .yaga/branch-policy.toml
          branch: ${{ github.ref_name }}
      - name: Run changed-path policy
        uses: ./
        with:
          check: change
          policy: .yaga/change-policy.toml
          range: ${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
      - name: Audit YAGA policy schemas
        uses: ./
        with:
          check: policy
      - name: Run aggregate repository checks
        uses: ./
        with:
          check: repo
          plan: .yaga/checks/ci.toml
          commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          revision: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  lint-and-build:
    name: Lint, Package Build & Docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.13.0"
      - name: Install the wheel build toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install pinned Typos CLI
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/crate-ci/typos/releases/download/v1.50.2/typos-v1.50.2-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/typos.tar.gz"
          echo "abcb3e257c7c2abeff4d903f7fe68071357637605bdb283ce2251f44bc70dc09  $RUNNER_TEMP/typos.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/typos-bin"
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/typos-bin" ./typos
          echo "$RUNNER_TEMP/typos-bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen --group dev --python 3.12
      - run: uv run --frozen --python 3.12 ruff check .
      - run: uv run --frozen --python 3.12 ruff format --check .
      - run: uv run --frozen --python 3.12 ty check
      - run: uv run --frozen --python 3.12 yaga --help
      - run: uv run --frozen --python 3.12 python -m yaga --help
      - run: |
          yaga_message="$(printf '%s\n\n%s' \
            'feat(ci): exercise the installed CLI' \
            'Keep the installed command path covered by this CI smoke test.')"
          uv run --frozen --python 3.12 yaga commit check --message "$yaga_message"
      - name: Exercise the pre-commit provider
        run: |
          printf '%s\n' 'not conventional' > "$RUNNER_TEMP/YAGA_COMMIT_EDITMSG"
          YAGA_PRE_COMMIT_STATUS=0
          uv run --frozen --python 3.12 pre-commit try-repo . yaga-commit-check \
            --hook-stage commit-msg \
            --commit-msg-filename "$RUNNER_TEMP/YAGA_COMMIT_EDITMSG" \
            > "$RUNNER_TEMP/yaga-pre-commit.log" 2>&1 || YAGA_PRE_COMMIT_STATUS=$?
          cat "$RUNNER_TEMP/yaga-pre-commit.log"
          test "$YAGA_PRE_COMMIT_STATUS" -eq 1
          grep -F -- 'hook id: yaga-commit-check' "$RUNNER_TEMP/yaga-pre-commit.log"
          grep -F -- 'exit code: 1' "$RUNNER_TEMP/yaga-pre-commit.log"
          grep -F -- '[syntax.header]' "$RUNNER_TEMP/yaga-pre-commit.log"
      - run: uv run --frozen --python 3.12 python scripts/check_build.py
      - name: Build documentation
        run: |
          uv run --frozen --python 3.12 zensical build --strict --clean
          uv run --frozen --python 3.12 python scripts/check_docs.py
          uv run --frozen --python 3.12 python scripts/check_description.py

  native:
    name: Rust CLI, tests, and wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, toolchain: "1.99.0"}
          - {os: windows-latest, toolchain: "1.100.0"}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.0"
          enable-cache: false
      - name: Install the native qualification toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
      - name: Install pinned Typos CLI (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/crate-ci/typos/releases/download/v1.50.2/typos-v1.50.2-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/typos.tar.gz"
          echo "abcb3e257c7c2abeff4d903f7fe68071357637605bdb283ce2251f44bc70dc09  $RUNNER_TEMP/typos.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/typos-bin"
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/typos-bin" ./typos
          echo "$RUNNER_TEMP/typos-bin" >> "$GITHUB_PATH"
      - name: Install pinned Typos CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'typos.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'typos-bin'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/crate-ci/typos/releases/download/v1.50.2/typos-v1.50.2-x86_64-pc-windows-msvc.zip' `
            -OutFile $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne '8474ca8bd72df497b7dee2272345bdea0d4926b18b708faea492fc9bcfd0b0e9') {
            throw "typos archive checksum mismatch: $hash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $dest -Force
          if (-not (Test-Path -LiteralPath (Join-Path $dest 'typos.exe') -PathType Leaf)) {
            throw 'typos.exe missing from archive'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $dest
      - run: uv sync --frozen --group dev --python 3.12
      - name: Qualify the Rust library, standalone CLI, platform wheel, and packaging tests
        run: uv run --frozen --python 3.12 python scripts/check_native.py
      - name: Verify Windows MSRV 1.99.0 fallback compilation
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: "1.99.0"
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo check -p yaga-core --locked
      - name: Verify crates.io workspace packages
        if: matrix.os == 'ubuntu-latest'
        run: cargo package --workspace --locked

  macos-wheel:
    name: macOS ARM64 Rust tests and wheel
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.99.0-aarch64-apple-darwin"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Run Rust tests and build the macOS ARM64 wheel
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo test --workspace --locked
          uv sync --frozen --group dev --no-install-project --python 3.12
          uv run --no-sync --python 3.12 python scripts/release_wheels.py build aarch64-apple-darwin native-wheel
          YAGA_TEST_NATIVE_BINARY="$PWD/target/aarch64-apple-darwin/release/yaga" \
            uv run --no-sync --python 3.12 pytest -n 0 tests/test_native_installers.py

  test:
    name: Python ${{ matrix.python-version }} wheel on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
          - python-version: "3.15"
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-latest' && '1.100.0' || '1.99.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.13.0"
      - name: Install the wheel build toolchain
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: uv sync --frozen --group dev --no-editable --python ${{ matrix.python-version }}
      - run: uv run --frozen --no-editable --python ${{ matrix.python-version }} pytest

  gate:
    name: CI Prerequisites
    if: always()
    needs: [yaga-checks, lint-and-build, native, macos-wheel, test]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the complete blocking matrix
        env:
          YAGA_CHECKS_RESULT: ${{ needs.yaga-checks.result }}
          LINT_AND_BUILD_RESULT: ${{ needs.lint-and-build.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          MACOS_WHEEL_RESULT: ${{ needs.macos-wheel.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          [[ "$YAGA_CHECKS_RESULT" == success ]]
          [[ "$LINT_AND_BUILD_RESULT" == success ]]
          [[ "$NATIVE_RESULT" == success ]]
          [[ "$MACOS_WHEEL_RESULT" == success ]]
          [[ "$TEST_RESULT" == success ]]
