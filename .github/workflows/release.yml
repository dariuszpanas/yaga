name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yaga-release
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    if: >-
      github.event_name == 'push' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require source on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.0"
          enable-cache: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
      - run: uv sync --frozen --group dev --python 3.12
      - name: Validate release metadata and prepare notes
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_EVENT" = push ]; then
            uv run --frozen python scripts/check_release.py "$RELEASE_TAG" --notes-file release-notes.md
          else
            uv run --frozen python scripts/check_release.py --notes-file release-notes.md
          fi
      - name: Install pinned Typos CLI
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/crate-ci/typos/releases/download/v1.50.2/typos-v1.50.2-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/typos.tar.gz"
          echo "abcb3e257c7c2abeff4d903f7fe68071357637605bdb283ce2251f44bc70dc09  $RUNNER_TEMP/typos.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/typos-bin"
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/typos-bin" ./typos
          echo "$RUNNER_TEMP/typos-bin" >> "$GITHUB_PATH"
      - name: Run the full gate and retain its validated distributions
        env:
          UV_FROZEN: "1"
        run: uv run --frozen make ci BUILD_ARGS="--output-dir dist" CHANGE_RANGE=""
      - name: Verify crates.io workspace packages
        run: cargo package --workspace --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  native-binaries:
    name: Verify standalone and Python wheel for ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-musl}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.0"
          enable-cache: false
      - name: Build and verify the standalone executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          host="$TARGET"
          if [[ "$RUNNER_OS" == Linux ]]; then host="${TARGET%-musl}-gnu"; fi
          version=1.99.0
          # Windows 1.100 exposes the suspended primary thread handle directly.
          if [[ "$RUNNER_OS" == Windows ]]; then version=1.100.0; fi
          export RUSTUP_TOOLCHAIN="$version-$host"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"
          rustup target add "$TARGET"
          if [[ "$RUNNER_OS" == macOS ]]; then
            export MACOSX_DEPLOYMENT_TARGET="11.0"
          fi
          cargo build --locked --release --target "$TARGET" -p yaga-cli
          binary="target/$TARGET/release/yaga"
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=".exe"; fi
          uv sync --frozen --group dev --no-install-project --python 3.12
          uv run --no-sync --python 3.12 python scripts/native_release.py stage "$TARGET" "$binary" native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-${{ matrix.target }}
          path: native/
          if-no-files-found: error
          retention-days: 7

      - name: Install and verify the actual standalone binary over loopback
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/yaga"
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=".exe"; fi
          YAGA_TEST_NATIVE_BINARY=$(uv run --no-sync --python 3.12 python -c 'import os, sys; print(os.path.abspath(sys.argv[1]))' "$binary")
          export YAGA_TEST_NATIVE_BINARY
          uv run --no-sync --python 3.12 pytest -n 0 tests/test_native_installers.py

      - name: Package and qualify the zero-dependency platform Python wheel
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/yaga"
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=".exe"; fi
          uv run --no-sync --python 3.12 python scripts/release_wheels.py build "$TARGET" native-wheel --prebuilt "$binary"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-wheel-${{ matrix.target }}
          path: native-wheel/*.whl
          if-no-files-found: error
          retention-days: 7

  python-assets:
    name: Collect verified Python distributions
    needs: [build, native-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-distribution
          path: sdist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-wheel-*
          merge-multiple: true
          path: wheels/
      - run: python scripts/release_wheels.py assemble sdist wheels release-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-release
          path: release-dist/
          if-no-files-found: error
          retention-days: 7

  native-assets:
    name: Assemble verified standalone releases
    needs: native-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: standalone-*
          merge-multiple: true
          path: native/
      - run: python scripts/native_release.py manifest native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-release
          path: native/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: [build, native-assets, python-assets]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/yaga-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-release
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-crates:
    name: Publish to crates.io
    needs: [build, native-assets, python-assets]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: crates-io
      url: https://crates.io/crates/yaga-cli
    permissions:
      contents: read
      id-token: write
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Select crates.io authentication mode
        id: auth-mode
        env:
          HAS_FALLBACK_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          if [ "$HAS_FALLBACK_TOKEN" = "true" ]; then
            printf 'use-oidc=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'use-oidc=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io via OIDC
        id: auth
        if: steps.auth-mode.outputs.use-oidc == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish workspace crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: cargo publish --workspace --locked

  github-release:
    name: Create GitHub Release
    needs: [build, publish, publish-crates]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-release
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-release
          path: native/
      - name: Announce the published version with its original artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz native/yaga-*
          --verify-tag --title "YAGA ${RELEASE_TAG#v}"
          --notes-file release-notes/release-notes.md
