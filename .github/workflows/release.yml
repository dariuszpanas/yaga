name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yaga-release
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    if: >-
      github.event_name == 'push' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require source on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.7"
          enable-cache: false
      - run: uv sync --frozen --group dev --python 3.12
      - name: Validate release metadata and prepare notes
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_EVENT" = push ]; then
            uv run --frozen python scripts/check_release.py "$RELEASE_TAG" --notes-file release-notes.md
          else
            uv run --frozen python scripts/check_release.py --notes-file release-notes.md
          fi
      - name: Install pinned Typos CLI
        run: cargo install typos-cli --version 1.49.0 --locked
      - name: Run the full gate and retain its validated distributions
        run: uv run --frozen make ci BUILD_ARGS="--output-dir dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  minimum-runtime:
    name: Audit release minimum dependencies on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          version: "0.13.0"
      - run: uv sync --frozen --group dev --python 3.12
      - name: Qualify and audit the retained release wheel
        shell: bash
        env:
          YAGA_MINIMUM_REPORT: ${{ runner.temp }}/minimum-runtime.json
        run: >-
          uv run --frozen --python 3.12 python scripts/check_minimum_runtime.py
          --wheel dist/*.whl --report "$YAGA_MINIMUM_REPORT"
      - name: Retain release minimum dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-minimum-runtime-${{ matrix.os }}
          path: ${{ runner.temp }}/minimum-runtime.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: [build, minimum-runtime]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/yaga-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create GitHub Release
    needs: [build, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes/
      - name: Announce the published version with its original artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz
          --verify-tag --title "YAGA ${RELEASE_TAG#v}"
          --notes-file release-notes/release-notes.md
