name: Commit Quality
run-name: >-
  Commit quality ${{ github.event_name }} on ${{ github.ref_name }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commit-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HF_HOME: ${{ github.workspace }}/.yaga-huggingface
  YAGA_QUALITY_MODEL_REVISION: 30c7895b3eb0270a3246ef3db7b43c837d8e553a
  YAGA_QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  YAGA_QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: Hugging Face commit quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.7"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/.yaga-huggingface
          key: yaga-quality-${{ runner.os }}-python3.12-${{ env.YAGA_QUALITY_MODEL_REVISION }}
      - run: uv sync --frozen --group dev --extra quality --python 3.12
      - name: Select the checked commit range
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            printf 'YAGA_QUALITY_RANGE=%s...%s\n' \
              "$YAGA_QUALITY_BASE_SHA" "$YAGA_QUALITY_HEAD_SHA" >> "$GITHUB_ENV"
          else
            printf 'YAGA_QUALITY_RANGE=HEAD\n' >> "$GITHUB_ENV"
          fi
      - name: Populate or use the model cache
        run: >-
          uv run --frozen --python 3.12 yaga commit quality
          --range "$YAGA_QUALITY_RANGE"
          --provider huggingface
          --task classification
          --revision "$YAGA_QUALITY_MODEL_REVISION"
          --format text
      - name: Prove offline cache reuse
        run: >-
          uv run --frozen --python 3.12 yaga commit quality
          --range "$YAGA_QUALITY_RANGE"
          --provider huggingface
          --task classification
          --revision "$YAGA_QUALITY_MODEL_REVISION"
          --offline
          --format text
