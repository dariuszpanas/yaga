name: YAGA Commit Check
description: Check a pull request title and exact commit range with repository-local YAGA policy
author: Dariusz Panas

inputs:
  trusted-config:
    description: Literal committed policy path; opt into default-branch pull_request_target validation
    required: false
    default: ""

outputs:
  exit-code:
    description: Commit check exit code (0 success, 1 findings, 2 input error)
    value: ${{ steps.policy.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Set up the YAGA runtime
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        token: ""
    - name: Check pull request commit policy
      id: policy
      shell: bash
      env:
        PYTHONUTF8: "1"
        YAGA_COMMIT_ACTION_RUNTIME: "1"
        YAGA_COMMIT_TRUSTED_CONFIG: ${{ inputs.trusted-config }}
      run: |
        set -euo pipefail
        unset PYTHONHOME
        YAGA_SOURCE="$(cd -- "$GITHUB_ACTION_PATH/../../src" && pwd -P)"
        test -f "$YAGA_SOURCE/yaga/commit_action_cli.py"
        export PYTHONPATH="$YAGA_SOURCE"
        export PYTHONSAFEPATH=1
        YAGA_REPORT="$(mktemp)"
        YAGA_ERROR="$(mktemp)"
        trap 'rm -f "$YAGA_REPORT" "$YAGA_ERROR"' EXIT
        set +e
        python -P -S -m yaga github pull-request check \
          --event-file "${GITHUB_EVENT_PATH:-}" \
          --repo "${GITHUB_WORKSPACE:-}" \
          --format github > "$YAGA_REPORT" 2> "$YAGA_ERROR"
        YAGA_STATUS=$?
        set -e
        printf 'exit-code=%s\n' "$YAGA_STATUS" >> "$GITHUB_OUTPUT"
        cat "$YAGA_REPORT"
        cat "$YAGA_ERROR" >&2
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          {
            printf '%s\n' '## YAGA commit policy'
            printf '%s\n' '<pre>'
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
              "$YAGA_REPORT" "$YAGA_ERROR"
            printf '%s\n' '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$YAGA_STATUS"

branding:
  icon: check-circle
  color: purple
