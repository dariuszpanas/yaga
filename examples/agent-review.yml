name: YAGA Agent Review Publisher
run-name: >-
  ${{ format('YAGA review wake from {0} run #{1}',
  github.event.workflow_run.name, github.event.workflow_run.run_number) }}

on:
  workflow_run:
    workflows: [CI, "YAGA Review Policy"]
    types: [completed]

permissions: {}

jobs:
  prepare:
    if: >-
      (github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'pull_request') ||
      (github.event.workflow_run.path == '.github/workflows/review-policy.yml' &&
      github.event.workflow_run.event == 'pull_request_target')
    name: Prepare Agent Review
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      route: ${{ steps.prepare.outputs.route }}
      pull_request_number: ${{ steps.prepare.outputs.pull_request_number }}
    steps:
      - name: Prepare Agent Review
        id: prepare
        uses: dariuszpanas/yaga@0000000000000000000000000000000000000000 # replace with audited SHA
        with:
          gate: agent-review
          operation: prepare
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerequisite-workflow: .github/workflows/ci.yml
          lifecycle-workflow: .github/workflows/review-policy.yml
          owner-id: ${{ vars.YAGA_AGENT_OWNER_ID }} # set to the owner's immutable user ID
          job-timeout-minutes: 15

  observe:
    needs: prepare
    if: needs.prepare.outputs.route == 'observe'
    name: Observe Agent Review
    concurrency:
      group: >-
        yaga-agent-review-worker-${{ github.repository_id }}-${{
        needs.prepare.outputs.pull_request_number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Observe Agent Review
        uses: dariuszpanas/yaga@0000000000000000000000000000000000000000 # replace with audited SHA
        with:
          gate: agent-review
          operation: observe
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerequisite-workflow: .github/workflows/ci.yml
          lifecycle-workflow: .github/workflows/review-policy.yml
          owner-id: ${{ vars.YAGA_AGENT_OWNER_ID }} # set to the owner's immutable user ID
          job-timeout-minutes: 15

  request-owner:
    needs: prepare
    if: needs.prepare.outputs.route == 'owner'
    name: Request Owner Agent Review
    concurrency:
      group: >-
        yaga-agent-review-worker-${{ github.repository_id }}-${{
        needs.prepare.outputs.pull_request_number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Request Owner Agent Review
        uses: dariuszpanas/yaga@0000000000000000000000000000000000000000 # replace with audited SHA
        with:
          gate: agent-review
          operation: request
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerequisite-workflow: .github/workflows/ci.yml
          lifecycle-workflow: .github/workflows/review-policy.yml
          owner-id: ${{ vars.YAGA_AGENT_OWNER_ID }} # set to the owner's immutable user ID
          job-timeout-minutes: 15

  authorize-external:
    needs: prepare
    if: needs.prepare.outputs.route == 'external'
    name: Approve External Agent Review
    concurrency:
      group: >-
        yaga-agent-review-approval-${{ github.repository_id }}-${{
        needs.prepare.outputs.pull_request_number }}
      cancel-in-progress: true
    environment:
      name: agent-review-approval
      deployment: false
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record Protected Approval
        uses: dariuszpanas/yaga@0000000000000000000000000000000000000000 # replace with audited SHA
        with:
          gate: agent-review
          operation: authorize
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerequisite-workflow: .github/workflows/ci.yml
          lifecycle-workflow: .github/workflows/review-policy.yml
          owner-id: ${{ vars.YAGA_AGENT_OWNER_ID }} # set to the owner's immutable user ID
          approval-marker: ${{ vars.YAGA_AGENT_APPROVAL_MARKER }}
          job-timeout-minutes: 15

  request-external:
    needs: [prepare, authorize-external]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.route == 'approved' ||
      (needs.prepare.outputs.route == 'external' &&
      needs.authorize-external.result == 'success'))
    name: Request Approved Agent Review
    concurrency:
      group: >-
        yaga-agent-review-worker-${{ github.repository_id }}-${{
        needs.prepare.outputs.pull_request_number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Request Approved Agent Review
        uses: dariuszpanas/yaga@0000000000000000000000000000000000000000 # replace with audited SHA
        with:
          gate: agent-review
          operation: request
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerequisite-workflow: .github/workflows/ci.yml
          lifecycle-workflow: .github/workflows/review-policy.yml
          owner-id: ${{ vars.YAGA_AGENT_OWNER_ID }} # set to the owner's immutable user ID
          job-timeout-minutes: 15

  finalize:
    needs: [prepare, observe, request-owner, authorize-external, request-external]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.route != 'skip'
    name: Finalize Review Policy
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Finalize Review Policy
        uses: dariuszpanas/yaga@0000000000000000000000000000000000000000 # replace with audited SHA
        with:
          gate: agent-review
          operation: finalize
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerequisite-workflow: .github/workflows/ci.yml
          lifecycle-workflow: .github/workflows/review-policy.yml
          owner-id: ${{ vars.YAGA_AGENT_OWNER_ID }} # set to the owner's immutable user ID
          job-timeout-minutes: 15
