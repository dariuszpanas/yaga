[agent-review]
version = 1
required = ["correctness", "security"]
aggregation = "all-required"

[agent-review.agents.correctness]
preset = "codex"
outcome = "review"
publication = "inline"

[agent-review.agents.security]
preset = "codex"
outcome = "review"
publication = "review"

[agent-review.agents.documentation]
preset = "docs"
outcome = "advisory"
publication = "comment"
