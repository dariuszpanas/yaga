name: YAGA
description: Publish conservative, exact-candidate GitHub status gates
author: Dariusz Panas

inputs:
  gate:
    description: Gate implementation to run; currently only agent-review
    required: true
    default: agent-review
  github-token:
    description: >-
      GitHub token with the documented per-operation Actions, contents,
      issues, pull-request, and commit-status permissions
    required: true
  operation:
    description: One of invalidate, prepare, authorize, observe, request, or finalize
    required: true
  prerequisite-workflow:
    description: Authenticated unprivileged pull-request CI workflow path
    required: false
    default: .github/workflows/ci.yml
  lifecycle-workflow:
    description: Trusted pull_request_target lifecycle workflow path
    required: false
    default: .github/workflows/review-policy.yml
  owner-id:
    description: Immutable GitHub user ID allowed to request without environment approval
    required: true
  approval-marker:
    description: >-
      Environment-only marker required by authorize; set it to
      agent-review-approval:v1 in the protected approval environment
    required: false
    default: ""
  request-timeout:
    description: Per-request GitHub REST timeout in seconds, from 1 through 30
    required: false
    default: "5"
  job-timeout-minutes:
    description: >-
      Usable YAGA polling and finalization window, from 15 through 360;
      set it equal to the action-only job's timeout-minutes
    required: true
  agent-review-policy-file:
    description: >-
      Optional path, relative to the trusted default-branch workspace, to the
      Agent review TOML policy
    required: false
    default: ""

outputs:
  route:
    description: Closed prepare route; skip, done, observe, owner, external, or approved
    value: ${{ steps.yaga.outputs.route }}
  pull_request_number:
    description: Exact pull request number emitted by prepare for job concurrency
    value: ${{ steps.yaga.outputs.pull_request_number }}

runs:
  using: composite
  steps:
    - name: Run YAGA
      id: yaga
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        YAGA_ACTION_RUNTIME: "1"
        YAGA_GATE: ${{ inputs.gate }}
        YAGA_APPROVAL_MARKER: ${{ inputs.approval-marker }}
        YAGA_AGENT_REVIEW_POLICY_FILE: ${{ inputs.agent-review-policy-file }}
        YAGA_LIFECYCLE_WORKFLOW: ${{ inputs.lifecycle-workflow }}
        YAGA_JOB_TIMEOUT_MINUTES: ${{ inputs.job-timeout-minutes }}
        YAGA_OPERATION: ${{ inputs.operation }}
        YAGA_OWNER_ID: ${{ inputs.owner-id }}
        YAGA_PREREQUISITE_WORKFLOW: ${{ inputs.prerequisite-workflow }}
        YAGA_REQUEST_TIMEOUT: ${{ inputs.request-timeout }}
      run: |
        set -euo pipefail
        unset PYTHONHOME
        export PYTHONPATH="$GITHUB_ACTION_PATH/src"
        export PYTHONSAFEPATH=1
        python -P -S -m yaga gate "$YAGA_GATE" "$YAGA_OPERATION"

branding:
  icon: shield
  color: green
