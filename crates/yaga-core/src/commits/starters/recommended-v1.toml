config-version = 1

[commit]
allowed-types = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "refactor",
    "revert",
    "style",
    "test",
]
type-case = "lower"
scope-policy = "optional"
scope-case = "lower"
header-max-length = 100
description-min-length = 3
description-ending = "forbid"
body-policy = "optional"
body-paragraph-splitting = "check"
dependabot-pull-requests = "check"
merge-commits = "reject"
ignored-headers = []
max-commits = 64
