size-policy-version = 1
default-max-blob-bytes = 4194304
# Keep generous headroom for the Rust workspace, lockfiles, and branding assets.
max-total-blob-bytes = 134217728

[[path-limits]]
pattern = "uv.lock"
max-blob-bytes = 8388608

# Preserve original branding PNGs and the transparent web logo.
[[path-limits]]
pattern = "docs/assets/branding/*.png"
max-blob-bytes = 8388608
