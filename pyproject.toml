[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatch_build"
backend-path = ["."]

[project]
name = "yaga-cli"
version = "0.6.0"
description = "Configurable developer workflow checks for local use and GitHub Actions"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [
    { name = "Dariusz Panas" },
]
keywords = [
    "cli",
    "conventional-commits",
    "git",
    "github-actions",
    "pre-commit",
    "quality-assurance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
]
# The Python distribution is a zero-dependency launcher for the bundled Rust binary.
dependencies = []

[project.optional-dependencies]
# Retained as empty compatibility extras for existing install commands.
quality = []
quality-bedrock = []

[tool.uv]
required-version = ">=0.12.7"

[project.urls]
Documentation = "https://dariuszpanas.github.io/yaga/"
Changelog = "https://dariuszpanas.github.io/yaga/changelog.html"
Repository = "https://github.com/dariuszpanas/yaga"
Issues = "https://github.com/dariuszpanas/yaga/issues"

[project.scripts]
yaga = "yaga.entrypoint:main"

[dependency-groups]
dev = [
    "hatchling==1.33.0",
    "packaging>=24",
    "pre-commit>=4.6.2,<5",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "pyyaml>=6.0.3,<7",
    "readme-renderer[md]>=46.0",
    "ruff>=0.14.13",
    "ty>=0.0.12",
    "zensical>=0.0.20",
]

[tool.hatch.build.targets.sdist]
# Hatchling may drop VCS exclusions when the checkout itself lives under an ignored
# directory. Select distributable source roots and apply generated-file rules locally.
only-include = [
    ".gitattributes", ".github", ".gitignore", ".pre-commit-hooks.yaml", ".yaga",
    "AGENTS.md", "CHANGELOG.md", "CONTRIBUTING.md", "Cargo.lock", "Cargo.toml",
    "LICENSE", "Makefile", "README.md", "SECURITY.md", "_typos.toml", "action.yml",
    "crates", "docs", "examples", "hatch_build.py", "overrides", "pyproject.toml", "scripts", "src",
    "tests", "uv.lock", "zensical.toml",
]
ignore-vcs = true
exclude = [
    ".artifacts/", ".cache/", ".coverage", ".pytest_cache/", ".ruff_cache/", ".venv/",
    "__pycache__/", "*.egg-info/", "*.py[cod]", "dist/", "htmlcov/", "site/", "/target/",
]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["src/yaga"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/native_wheel.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -n auto --dist worksteal"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PIE",
    "UP",
    "W",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["yaga"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.yaga]
config-version = 1

[tool.yaga.commit]
allowed-types = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "refactor",
    "revert",
    "style",
    "test",
]
type-case = "lower"
scope-policy = "optional"
scope-policy-by-type = { feat = "required", fix = "required" }
scope-case = "lower"
header-max-length = 100
description-min-length = 3
description-ending = "forbid"
breaking-markers = "paired"
forbidden-footer-tokens = ["WIP"]
body-policy = "required"
body-min-words = 8
body-paragraph-splitting = "check"
typos = "check"
dependabot-pull-requests = "skip"
merge-commits = "reject"
ignored-headers = []
max-commits = 1000
