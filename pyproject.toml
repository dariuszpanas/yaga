[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "yaga-cli"
version = "0.1.0"
description = "Configurable developer workflow checks for local use and GitHub Actions"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [
    { name = "Dariusz Panas" },
]
keywords = [
    "cli",
    "conventional-commits",
    "git",
    "github-actions",
    "pre-commit",
    "quality-assurance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0.3,<7",
    "typer>=0.27.2,<1",
]

[tool.uv]
required-version = "==0.9.18"

[project.urls]
Repository = "https://github.com/dariuszpanas/yaga"
Issues = "https://github.com/dariuszpanas/yaga/issues"

[project.scripts]
yaga = "yaga.cli:main"

[dependency-groups]
dev = [
    "hatchling==1.32.0",
    "pre-commit>=4.6.2,<5",
    "pytest>=8.3",
    "ruff>=0.14.13",
    "ty>=0.0.12",
    "zensical>=0.0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yaga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PIE",
    "UP",
    "W",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["yaga"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.yaga]
config-version = 1

[tool.yaga.commit]
allowed-types = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "refactor",
    "revert",
    "style",
    "test",
]
type-case = "lower"
scope-policy = "optional"
scope-policy-by-type = { feat = "required", fix = "required" }
scope-case = "lower"
header-max-length = 100
description-min-length = 3
description-ending = "forbid"
breaking-markers = "paired"
forbidden-footer-tokens = ["WIP"]
body-policy = "optional"
body-min-words = 8
body-max-line-length = 100
dependabot-pull-requests = "skip"
merge-commits = "reject"
ignored-headers = []
max-commits = 64
